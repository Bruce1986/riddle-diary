<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 14px 16px;
        font-family: -apple-system, "PingFang TC", sans-serif;
        color: #2a1206;
        background: #e7d9b8;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { font-size: 11px; color: #7a6a45; margin: 0 0 14px; }
      label {
        display: flex; align-items: center; gap: 8px;
        font-size: 13px; padding: 7px 0; cursor: pointer;
      }
      input[type="checkbox"] { width: 15px; height: 15px; accent-color: #6b1d12; }
      .hint { font-size: 11px; color: #8a7a52; margin-top: 10px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>湯姆瑞斗的日記本</h1>
    <p class="sub">在 claude.ai 上開啟。</p>
    <label><input type="checkbox" id="enabled" /> 開啟日記偽裝</label>
    <label><input type="checkbox" id="persona" /> 啟用湯姆·瑞斗人設</label>
    <p class="hint">提示：日記畫面中長按右上「窺視」可暫時看一眼底下的 Claude。</p>
    <script src="popup.js"></script>
  </body>
</html>
