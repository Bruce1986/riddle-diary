name: Node CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

# 最小權限：本 job 只需唯讀簽出，不需寫回 repo（防範惡意 PR / 供應鏈套件濫用 GITHUB_TOKEN）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 以 commit SHA 釘選 action，避免可變 tag 被重指標而在 CI 注入惡意程式（供應鏈防禦）。
      # 註解一律寫「確切版本」而非浮動的 v4：寫 v4 看不出實際釘在哪一版，
      # Dependabot / Renovate 也是靠這段註解判斷要不要升版。
      # SHA 已對官方 repo 的 tag 逐一核對（git ls-remote --tags）。
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Skip npm install (no package.json)
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json found, skipping install."
      # Automatically attempt to fix lint issues first, then
      # run the linter again to show any remaining problems
      - name: Run lint fixes
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint:fix --if-present
      - name: Run linter
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint --if-present
      - name: Run tests
        if: ${{ hashFiles('package.json') != '' }}
        run: npm test --if-present

  # 突變驗證：逐一把 content.js 的保護改壞，確認 SPA 測試會轉紅。
  # 沒有這道關卡時，突變登錄的 find 字串會隨重構默默失效——PR #4 的
  # review loop 中就實際發生兩次（重構後 find 對不上，改完才發現）。
  #
  # 刻意獨立成 job，不併進 build：
  # 1. build 會先跑 `npm run lint:fix`，那會改動工作樹；而 mutation-check.js
  #    要求 content.js 在 git 工作樹中乾淨（它靠 `git checkout` 還原每隻突變），
  #    同 job 執行會直接卡在前置檢查。
  # 2. 與 build 平行跑，不拖長 lint/test 這個快速訊號的回饋時間。
  #
  # 本 job 不套用 build 那組 `hashFiles('package.json')` 條件：那是通用模板的
  # 防禦，而這裡整個 job 的存在意義就是跑 npm script，沒有 package.json 時
  # 本來就該紅，不該靜默跳過。
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 本機實測約 85 秒（39 隻突變 × SPA 測試檔）；上限留寬裕但擋住失控
    steps:
      # SHA pin 與註解慣例同 build job（確切版本，非浮動 v4）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run mutation check
        run: npm run test:mutation
